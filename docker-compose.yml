services:
  class-information-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: class-information-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Tokyo
      - APP_TIMEZONE=Asia/Tokyo
      - DISCORD_FORCE_IPV4=1
      - AIOHTTP_DNS_TTL=60
    # DNS はホスト/ネットワーク環境に依存するため固定しない
    # main.py が WEB_PORT(既定 8000) で FastAPI を起動するため公開
    ports:
      - "8000:8000"
    # ユーザーデータ JSON / logs / gmail_tokens などを永続化
    volumes:
      - ./:/app
    command: ["python", "main.py"]

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token YOUR_COPIED_TOKEN_HERE
