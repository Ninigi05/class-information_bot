services:
  class-information-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: class-information-bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      - TZ=Asia/Tokyo
      - APP_TIMEZONE=Asia/Tokyo
      - DISCORD_FORCE_IPV4=1
      - AIOHTTP_DNS_TTL=60
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: ["python", "main.py"]
    networks:
      - bot-network

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    # ─── command を短くシンプルに変更 ───
    command: tunnel run
    # .env ファイルを直接マウントするか環境変数を受け取る
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
