<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | 授業登録 Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8 space-y-6">
    <div class="text-center">
      <h1 class="text-3xl font-extrabold text-slate-900">Class information bot</h1>
      <p class="text-base text-slate-600 mt-2">授業登録 Webダッシュボード</p>
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-800 space-y-2">
      <p class="font-bold">💡 ログインについて</p>
      <p>このシステムは Discord 認証を使用して安全にあなた専用の時間割情報を管理します。他のユーザーにデータが公開されることはありません。</p>
    </div>

    <div class="pt-4">
      <button id="login-btn" 
         class="flex items-center justify-center gap-3 w-full py-3.5 px-4 rounded-xl bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold text-lg transition duration-200 shadow-md">
        <svg class="w-6 h-6 fill-current" viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.4-5c.87-.64,1.71-1.32,2.51-2a75.43,75.43,0,0,0,72.6,0c.8.71,1.64,1.39,2.51,2a68.53,68.53,0,0,1-10.4,5,77.7,77.7,0,0,0,6.63,10.85,105.73,105.73,0,0,0,31-18.83C129.87,49.1,123.6,26.47,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
        </svg>
        Discord でログイン
      </button>
    </div>

    <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
      <a href="/privacy.html" class="hover:underline">プライバシーポリシー</a>
      <span class="mx-1.5">•</span>
      <a href="/terms.html" class="hover:underline">利用規約</a>
    </div>
  </div>

  <script>
    // すでにログインしている場合は自動的にダッシュボードへリダイレクト
    const token = localStorage.getItem('token');
    if (token) {
      window.location.href = '/';
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      try {
        // バックエンドから認証URLとstateを取得
        const response = await fetch('/auth/url');
        const data = await response.json();
        
        // CSRF対策: stateをlocalStorageに保存
        localStorage.setItem('oauth_state', data.state);
        
        // Discord認証ページへリダイレクト
        window.location.href = data.url;
      } catch (e) {
        console.error(e);
        alert('ログインの準備中にエラーが発生しました');
      }
    });
  </script>
</body>
</html>
