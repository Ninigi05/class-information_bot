<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #fef3c7 0%, #fff7ed 30%, #ecfeff 100%);
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen">
  <main class="max-w-7xl mx-auto p-4 md:p-8">
    <section class="rounded-2xl border border-amber-200 bg-white/85 backdrop-blur shadow-xl overflow-hidden">
      <div class="px-6 py-6 md:px-8 md:py-7 bg-gradient-to-r from-amber-100 via-orange-100 to-cyan-100 border-b border-amber-200">
        <h1 class="text-2xl md:text-3xl font-black tracking-tight">Time Table Dashboard</h1>
        <p class="text-sm md:text-base text-slate-600 mt-2">GitHub Pages から自宅PCの FastAPI を操作します</p>
      </div>

      <div class="p-6 md:p-8 space-y-6">
        <div id="toast" class="hidden rounded-lg px-4 py-3 text-sm font-semibold"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <label class="block">
            <span class="text-sm font-bold text-slate-700">API Base URL</span>
            <input id="apiBaseUrl" type="text" class="mt-1 w-full rounded-lg border-slate-300 focus:ring-2 focus:ring-cyan-500" placeholder="https://example.com" value="http://localhost:8000" />
          </label>
          <label class="block">
            <span class="text-sm font-bold text-slate-700">API Key</span>
            <input id="apiKey" type="password" class="mt-1 w-full rounded-lg border-slate-300 focus:ring-2 focus:ring-cyan-500" placeholder="X-API-Key" />
          </label>
          <label class="block">
            <span class="text-sm font-bold text-slate-700">Discord User ID</span>
            <input id="userId" type="text" class="mt-1 w-full rounded-lg border-slate-300 focus:ring-2 focus:ring-cyan-500" placeholder="123456789012345678" />
          </label>
          <div class="flex items-end gap-2">
            <button id="loadBtn" class="w-full rounded-lg bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-4 py-2.5 transition">読み込み</button>
          </div>
        </div>

        <div class="rounded-xl bg-slate-50 border border-slate-200 p-4 text-sm text-slate-600">
          セルをクリックすると授業の追加・更新・削除ができます。
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full border border-slate-200 rounded-xl overflow-hidden" id="timetable"></table>
        </div>
      </div>
    </section>
  </main>

  <dialog id="editDialog" class="rounded-xl p-0 w-[min(92vw,440px)] backdrop:bg-slate-900/30">
    <form method="dialog" class="p-0">
      <div class="px-5 py-4 border-b bg-slate-50">
        <h2 class="text-lg font-extrabold" id="dialogTitle">授業を編集</h2>
      </div>
      <div class="p-5 space-y-4">
        <p class="text-sm text-slate-600" id="dialogSlot"></p>
        <label class="block">
          <span class="text-sm font-bold">科目名</span>
          <input id="subjectInput" type="text" class="mt-1 w-full rounded-lg border-slate-300" />
        </label>
        <label class="block">
          <span class="text-sm font-bold">教室</span>
          <input id="roomInput" type="text" class="mt-1 w-full rounded-lg border-slate-300" />
        </label>
      </div>
      <div class="px-5 py-4 border-t bg-slate-50 flex gap-2 justify-end">
        <button id="deleteBtn" value="cancel" class="rounded-lg bg-rose-100 text-rose-700 font-bold px-4 py-2">削除</button>
        <button value="cancel" class="rounded-lg bg-slate-200 text-slate-700 font-bold px-4 py-2">閉じる</button>
        <button id="saveBtn" value="default" class="rounded-lg bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-4 py-2">保存</button>
      </div>
    </form>
  </dialog>

  <script>
    const storageKeys = {
      apiBaseUrl: "classdash_apiBaseUrl",
      apiKey: "classdash_apiKey",
      userId: "classdash_userId",
    };

    const state = {
      weekdays: [],
      periods: [],
      periodToTime: {},
      table: {},
      editing: null,
    };

    const el = {
      apiBaseUrl: document.getElementById("apiBaseUrl"),
      apiKey: document.getElementById("apiKey"),
      userId: document.getElementById("userId"),
      loadBtn: document.getElementById("loadBtn"),
      timetable: document.getElementById("timetable"),
      toast: document.getElementById("toast"),
      editDialog: document.getElementById("editDialog"),
      dialogTitle: document.getElementById("dialogTitle"),
      dialogSlot: document.getElementById("dialogSlot"),
      subjectInput: document.getElementById("subjectInput"),
      roomInput: document.getElementById("roomInput"),
      saveBtn: document.getElementById("saveBtn"),
      deleteBtn: document.getElementById("deleteBtn"),
    };

    function loadSavedSettings() {
      for (const [k, key] of Object.entries(storageKeys)) {
        const v = localStorage.getItem(key);
        if (v) el[k].value = v;
      }
    }

    function saveSettings() {
      for (const [k, key] of Object.entries(storageKeys)) {
        localStorage.setItem(key, el[k].value.trim());
      }
    }

    function showToast(message, type = "info") {
      const map = {
        info: "bg-slate-100 text-slate-700 border border-slate-300",
        success: "bg-emerald-100 text-emerald-800 border border-emerald-300",
        error: "bg-rose-100 text-rose-800 border border-rose-300",
      };
      el.toast.className = "rounded-lg px-4 py-3 text-sm font-semibold " + map[type];
      el.toast.textContent = message;
      el.toast.classList.remove("hidden");
      setTimeout(() => el.toast.classList.add("hidden"), 2800);
    }

    function getConfig() {
      const apiBaseUrl = el.apiBaseUrl.value.trim().replace(/\/$/, "");
      const apiKey = el.apiKey.value.trim();
      const userId = el.userId.value.trim();
      if (!apiBaseUrl || !apiKey || !userId) {
        throw new Error("API URL / API Key / User ID を入力してください");
      }
      return { apiBaseUrl, apiKey, userId };
    }

    async function apiFetch(path, options = {}) {
      const { apiBaseUrl, apiKey } = getConfig();
      const res = await fetch(apiBaseUrl + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": apiKey,
          ...(options.headers || {}),
        },
      });
      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try {
          const body = await res.json();
          detail = body.detail || detail;
        } catch (_) {}
        throw new Error(detail);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function renderTable() {
      const { weekdays, periods, periodToTime, table } = state;
      let html = "";

      html += "<thead class='bg-slate-100'>";
      html += "<tr>";
      html += "<th class='px-3 py-3 border text-xs md:text-sm'>時限</th>";
      for (const w of weekdays) {
        html += `<th class='px-3 py-3 border text-xs md:text-sm'>${w}</th>`;
      }
      html += "</tr></thead>";

      html += "<tbody>";
      for (const p of periods) {
        const time = periodToTime[p] || "";
        html += "<tr>";
        html += `<td class='px-2 py-3 border text-center text-xs md:text-sm font-bold bg-slate-50 whitespace-nowrap'>${p}限<br><span class='font-normal text-slate-500'>${time}</span></td>`;

        for (const w of weekdays) {
          const c = table?.[w]?.[p] || null;
          const baseCls = "w-full text-left rounded-lg border p-2 min-h-[64px] transition";
          if (c) {
            html += `<td class='border p-1'>
              <button class='${baseCls} bg-cyan-50 hover:bg-cyan-100 border-cyan-200' data-weekday='${w}' data-period='${p}'>
                <div class='text-sm font-bold text-cyan-900'>${escapeHtml(c.subject || "")}</div>
                <div class='text-xs text-cyan-800 mt-1'>${escapeHtml(c.room || "")}</div>
              </button>
            </td>`;
          } else {
            html += `<td class='border p-1'>
              <button class='${baseCls} bg-white hover:bg-amber-50 border-dashed border-slate-300' data-weekday='${w}' data-period='${p}'>
                <div class='text-xs text-slate-400'>クリックして追加</div>
              </button>
            </td>`;
          }
        }
        html += "</tr>";
      }
      html += "</tbody>";

      el.timetable.innerHTML = html;
      el.timetable.querySelectorAll("button[data-weekday]").forEach((btn) => {
        btn.addEventListener("click", () => openEditor(btn.dataset.weekday, btn.dataset.period));
      });
    }

    function openEditor(weekday, period) {
      const current = state.table?.[weekday]?.[period] || null;
      state.editing = { weekday, period, current };
      el.dialogTitle.textContent = current ? "授業を更新" : "授業を追加";
      el.dialogSlot.textContent = `${weekday} ${period}限`;
      el.subjectInput.value = current?.subject || "";
      el.roomInput.value = current?.room || "";
      el.deleteBtn.style.display = current ? "inline-block" : "none";
      el.editDialog.showModal();
    }

    async function loadSchedule() {
      const { userId } = getConfig();
      saveSettings();
      el.loadBtn.disabled = true;
      el.loadBtn.textContent = "読み込み中...";
      try {
        const data = await apiFetch(`/api/user/${userId}/schedule-table`);
        state.weekdays = data.weekdays || [];
        state.periods = data.periods || [];
        state.periodToTime = data.period_to_time || {};
        state.table = data.table || {};
        renderTable();
        showToast("時間割を読み込みました", "success");
      } finally {
        el.loadBtn.disabled = false;
        el.loadBtn.textContent = "読み込み";
      }
    }

    async function saveCurrentCell() {
      if (!state.editing) return;
      const { userId } = getConfig();
      const payload = {
        weekday: state.editing.weekday,
        period: state.editing.period,
        subject: el.subjectInput.value.trim(),
        room: el.roomInput.value.trim(),
      };
      if (!payload.subject || !payload.room) {
        throw new Error("科目名と教室を入力してください");
      }
      await apiFetch(`/api/user/${userId}/classes/upsert`, {
        method: "POST",
        body: JSON.stringify(payload),
      });
      el.editDialog.close();
      await loadSchedule();
      showToast("保存しました", "success");
    }

    async function deleteCurrentCell() {
      if (!state.editing) return;
      const { userId } = getConfig();
      const { weekday, period } = state.editing;
      await apiFetch(`/api/user/${userId}/classes/${encodeURIComponent(weekday)}/${encodeURIComponent(period)}`, {
        method: "DELETE",
      });
      el.editDialog.close();
      await loadSchedule();
      showToast("削除しました", "success");
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    el.loadBtn.addEventListener("click", async () => {
      try {
        await loadSchedule();
      } catch (e) {
        showToast(e.message || "読み込みに失敗しました", "error");
      }
    });

    el.saveBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      try {
        await saveCurrentCell();
      } catch (err) {
        showToast(err.message || "保存に失敗しました", "error");
      }
    });

    el.deleteBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      try {
        await deleteCurrentCell();
      } catch (err) {
        showToast(err.message || "削除に失敗しました", "error");
      }
    });

    [el.apiBaseUrl, el.apiKey, el.userId].forEach((input) => {
      input.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          try {
            await loadSchedule();
          } catch (err) {
            showToast(err.message || "読み込みに失敗しました", "error");
          }
        }
      });
    });

    loadSavedSettings();
  </script>
</body>
</html>
