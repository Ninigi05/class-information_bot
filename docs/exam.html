<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="GYcBr85bd_gvAGQdALnQMxhxpf36t6_s8N8xk_PpmNc" />
  <title>Class information bot | 試験時間割 登録</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-6">
    <section class="bg-white rounded-2xl shadow border border-slate-200 p-5 md:p-7">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 class="text-2xl font-extrabold">Class information bot</h1>
          <p class="text-base font-semibold text-slate-700 mt-1">試験時間割 登録</p>
          <p class="text-sm text-slate-600 mt-1">ここで入力した内容は通常ページのキー発行時にまとめて連携されます。</p>
          <div class="flex gap-2 mt-3">
            <button type="button" id="termToggle1st" class="px-3 py-1.5 rounded text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700">前期</button>
            <button type="button" id="termToggle2nd" class="px-3 py-1.5 rounded text-sm font-bold bg-slate-300 text-slate-700 hover:bg-slate-400">後期</button>
          </div>
        </div>
        <div class="flex flex-wrap gap-2">
          <a href="./guide.html" class="px-4 py-2 rounded-lg bg-amber-500 text-white font-bold hover:bg-amber-600">使い方ガイド</a>
          <a href="https://discord.gg/5dJpUbgB4X" target="_blank" rel="noopener" class="px-4 py-2 rounded-lg bg-sky-600 text-white font-bold hover:bg-sky-700">Discordサーバーに参加</a>
          <a href="./index.html" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold hover:bg-indigo-700">通常ページへ戻る</a>
          <a href="./privacy.html" class="px-4 py-2 rounded-lg bg-slate-700 text-white font-bold hover:bg-slate-800">プライバシーポリシー</a>
          <a href="./terms.html" class="px-4 py-2 rounded-lg bg-slate-700 text-white font-bold hover:bg-slate-800">利用規約</a>
        </div>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow border border-slate-200 p-5 md:p-7 space-y-4">
      <h2 class="text-lg font-bold">機能別キー発行</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
        <button type="button" id="issueKeyAll" class="px-3 py-2 rounded-lg bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700">全機能キー</button>
        <button type="button" id="issueKeyClasses" class="px-3 py-2 rounded-lg bg-cyan-600 text-white font-bold text-sm hover:bg-cyan-700">時間割キー</button>
        <button type="button" id="issueKeyNotify" class="px-3 py-2 rounded-lg bg-cyan-600 text-white font-bold text-sm hover:bg-cyan-700">通知キー</button>
        <button type="button" id="issueKeyOverrides" class="px-3 py-2 rounded-lg bg-cyan-600 text-white font-bold text-sm hover:bg-cyan-700">上書きキー</button>
        <button type="button" id="issueKeyGmail" class="px-3 py-2 rounded-lg bg-amber-600 text-white font-bold text-sm hover:bg-amber-700">Gmail認証キー</button>
        <button type="button" id="issueKeyExam" class="px-3 py-2 rounded-lg bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700">試験キー</button>
      </div>
      <div id="result" class="text-sm bg-slate-50 p-3 rounded border-l-4 border-slate-300 hidden"></div>
    </section>

    <section class="bg-white rounded-2xl shadow border border-slate-200 p-5 md:p-7 space-y-4">
      <h2 class="text-lg font-bold">試験通知設定</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <label><span class="text-sm">試験前通知 1回目（分）</span><input id="examFirst" type="number" min="1" value="30" class="mt-1 w-full rounded border-slate-300" /></label>
        <label><span class="text-sm">試験前通知 2回目（分）</span><input id="examSecond" type="number" min="1" value="25" class="mt-1 w-full rounded border-slate-300" /></label>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow border border-slate-200 p-5 md:p-7 space-y-4">
      <h2 class="text-lg font-bold">試験時間割</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
        <label><span class="text-sm">時間割名</span><input id="schedName" type="text" class="mt-1 w-full rounded border-slate-300" /></label>
        <label><span class="text-sm">開始日</span><input id="schedStart" type="date" class="mt-1 w-full rounded border-slate-300" /></label>
        <label><span class="text-sm">終了日</span><input id="schedEnd" type="date" class="mt-1 w-full rounded border-slate-300" /></label>
        <button type="button" id="addSchedule" class="px-4 py-2 rounded bg-indigo-600 text-white font-bold hover:bg-indigo-700">時間割追加</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
        <label class="md:col-span-3"><span class="text-sm">対象時間割</span><select id="targetSchedule" class="mt-1 w-full rounded border-slate-300"></select></label>
        <button type="button" id="removeSchedule" class="px-4 py-2 rounded bg-rose-600 text-white font-bold hover:bg-rose-700">選択中の時間割を削除</button>
      </div>

      <div class="overflow-x-auto">
        <table id="examTimetable" class="min-w-full border border-slate-300"></table>
      </div>
      <p class="text-xs text-slate-500">セルクリックで授業追加/編集（通常時間割ページと同じ操作）</p>

      <div id="examList" class="text-sm"></div>
    </section>

    <section class="bg-white rounded-2xl shadow border border-slate-200 p-5 md:p-7 space-y-4">
      <h2 class="text-lg font-bold">試験時限 開始時刻上書き</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
        <label><span class="text-sm">時限</span><select id="examOvPeriod" class="mt-1 w-full rounded border-slate-300"></select></label>
        <label><span class="text-sm">開始時刻</span><input id="examOvTime" type="time" class="mt-1 w-full rounded border-slate-300" /></label>
        <button type="button" id="addExamOv" class="px-4 py-2 rounded bg-emerald-600 text-white font-bold hover:bg-emerald-700">上書き追加</button>
      </div>
      <div id="examOvList" class="text-sm"></div>
    </section>
  </main>

  <dialog id="examClassDialog" class="rounded-xl p-0 w-[min(92vw,460px)] backdrop:bg-slate-900/30">
    <form method="dialog" class="p-0">
      <div class="px-5 py-4 border-b bg-slate-50"><h3 class="text-lg font-bold" id="examDialogTitle">試験授業編集</h3></div>
      <div class="p-5 space-y-3">
        <p id="examDialogSlot" class="text-sm text-slate-600"></p>
        <label class="block"><span class="text-sm">科目名</span><input id="dlgExamSubject" type="text" class="mt-1 w-full rounded border-slate-300" /></label>
        <label class="block"><span class="text-sm">教室</span><input id="dlgExamRoom" type="text" class="mt-1 w-full rounded border-slate-300" /></label>
        <label class="block"><span class="text-sm">開始時刻（任意）</span><input id="dlgExamTime" type="time" class="mt-1 w-full rounded border-slate-300" /></label>
      </div>
      <div class="px-5 py-4 border-t bg-slate-50 flex justify-end gap-2">
        <button type="button" id="dlgExamDelete" class="px-3 py-2 rounded bg-rose-100 text-rose-700 font-bold">削除</button>
        <button type="button" id="dlgExamClose" class="px-3 py-2 rounded bg-slate-200 font-bold">閉じる</button>
        <button type="button" id="dlgExamSave" class="px-3 py-2 rounded bg-cyan-600 text-white font-bold">保存</button>
      </div>
    </form>
  </dialog>

  <script>
    const BACKEND = "https://technique-lol-fishing-shell.trycloudflare.com";
    const STORAGE_KEY = "web_reg_draft_v2";
    const TERM_STORAGE_KEY = "web_current_term";
    const weekdays = ["月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日", "日曜日"];
    const periods = ["1", "2", "3", "4", "5", "6"];

    let currentTerm = localStorage.getItem(TERM_STORAGE_KEY) || "前期";

    const draft = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {
      classes_by_term: { "前期": [], "後期": [] },
      notify: { normal_first: 15, normal_second: 10, exam_first: 30, exam_second: 25, morning_time: "08:00" },
      period_overrides: {},
      day_overrides: [],
      room_overrides: [],
      exam_schedules_by_term: { "前期": [], "後期": [] },
      exam_period_overrides: {},
      gmail_auth_code: "",
    };

    // Migration for old single-term structure
    if (Array.isArray(draft.classes)) {
      draft.classes_by_term = { "前期": draft.classes, "後期": [] };
      delete draft.classes;
    }
    if (Array.isArray(draft.exam_schedules)) {
      draft.exam_schedules_by_term = { "前期": draft.exam_schedules, "後期": [] };
      delete draft.exam_schedules;
    }

    const el = {
      termToggle1st: document.getElementById("termToggle1st"),
      termToggle2nd: document.getElementById("termToggle2nd"),
      examFirst: document.getElementById("examFirst"),
      examSecond: document.getElementById("examSecond"),
      schedName: document.getElementById("schedName"),
      schedStart: document.getElementById("schedStart"),
      schedEnd: document.getElementById("schedEnd"),
      addSchedule: document.getElementById("addSchedule"),
      targetSchedule: document.getElementById("targetSchedule"),
      removeSchedule: document.getElementById("removeSchedule"),
      examTimetable: document.getElementById("examTimetable"),
      examList: document.getElementById("examList"),
      examOvPeriod: document.getElementById("examOvPeriod"),
      examOvTime: document.getElementById("examOvTime"),
      addExamOv: document.getElementById("addExamOv"),
      examOvList: document.getElementById("examOvList"),
      examClassDialog: document.getElementById("examClassDialog"),
      examDialogTitle: document.getElementById("examDialogTitle"),
      examDialogSlot: document.getElementById("examDialogSlot"),
      dlgExamSubject: document.getElementById("dlgExamSubject"),
      dlgExamRoom: document.getElementById("dlgExamRoom"),
      dlgExamTime: document.getElementById("dlgExamTime"),
      dlgExamSave: document.getElementById("dlgExamSave"),
      dlgExamDelete: document.getElementById("dlgExamDelete"),
      dlgExamClose: document.getElementById("dlgExamClose"),
      issueKeyAll: document.getElementById("issueKeyAll"),
      issueKeyClasses: document.getElementById("issueKeyClasses"),
      issueKeyNotify: document.getElementById("issueKeyNotify"),
      issueKeyOverrides: document.getElementById("issueKeyOverrides"),
      issueKeyGmail: document.getElementById("issueKeyGmail"),
      issueKeyExam: document.getElementById("issueKeyExam"),
      result: document.getElementById("result"),
    };

    let editing = null;

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
    }

    function wireEnterFlow(elements, onLast) {
      elements.forEach((elRef, idx) => {
        elRef.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          const next = elements[idx + 1];
          if (next) {
            next.focus();
            if (typeof next.select === "function") next.select();
            return;
          }
          onLast();
        });
      });
    }

    function examSchedules() {
      return draft.exam_schedules_by_term[currentTerm] || [];
    }

    function renderScheduleSelect() {
      const schedules = examSchedules();
      if (!schedules.length) {
        el.targetSchedule.innerHTML = "<option value=''>時間割を作成してください</option>";
        return;
      }
      el.targetSchedule.innerHTML = schedules
        .map((s, i) => `<option value='${i}'>${escapeHtml(s.name)} (${s.start}〜${s.end})</option>`)
        .join("");
    }

    function selectedSchedule() {
      const idx = Number(el.targetSchedule.value);
      if (Number.isNaN(idx) || idx < 0) return null;
      const schedules = examSchedules();
      return schedules[idx] || null;
    }

    function classAt(schedule, weekday, period) {
      return (schedule?.classes || []).find(c => c.weekday === weekday && String(c.period) === String(period)) || null;
    }

    function setExamClass(schedule, weekday, period, subject, room, time) {
      schedule.classes = (schedule.classes || []).filter(c => !(c.weekday === weekday && String(c.period) === String(period)));
      if (subject && room) {
        schedule.classes.push({
          weekday,
          period: String(period),
          subject,
          room,
          time: time || null,
        });
      }
      save();
      renderExamTimetable();
      renderExamList();
    }

    function renderExamTimetable() {
      const schedule = selectedSchedule();
      if (!schedule) {
        el.examTimetable.innerHTML = "<tbody><tr><td class='border p-3 text-slate-400'>時間割を作成してください</td></tr></tbody>";
        return;
      }
      let html = "<thead><tr><th class='border p-2 bg-slate-100'>時限</th>";
      for (const w of weekdays) html += `<th class='border p-2 bg-slate-100'>${w}</th>`;
      html += "</tr></thead><tbody>";
      for (const p of periods) {
        html += `<tr><td class='border p-2 bg-slate-50 text-center font-bold'>${p}限</td>`;
        for (const w of weekdays) {
          const c = classAt(schedule, w, p);
          const timeLabel = c?.time ? `<div class='text-[11px] text-cyan-700'>${escapeHtml(c.time)}</div>` : "";
          html += `<td class='border p-1'>
            <button type='button' class='w-full min-h-[66px] text-left rounded ${c ? "bg-cyan-50 hover:bg-cyan-100 border border-cyan-200" : "bg-white hover:bg-slate-50 border border-dashed border-slate-300"}' data-weekday='${w}' data-period='${p}'>
              ${c ? `<div class='font-bold text-cyan-900 text-sm'>${escapeHtml(c.subject)}</div><div class='text-xs text-cyan-700'>${escapeHtml(c.room)}</div>${timeLabel}` : "<div class='text-xs text-slate-400'>追加</div>"}
            </button>
          </td>`;
        }
        html += "</tr>";
      }
      html += "</tbody>";
      el.examTimetable.innerHTML = html;
      el.examTimetable.querySelectorAll("button[data-weekday]").forEach(btn => {
        btn.addEventListener("click", () => openExamDialog(btn.dataset.weekday, btn.dataset.period));
      });
    }

    function openExamDialog(weekday, period) {
      const schedule = selectedSchedule();
      if (!schedule) return;
      const cur = classAt(schedule, weekday, period);
      editing = { weekday, period };
      el.examDialogTitle.textContent = cur ? "試験授業編集" : "試験授業追加";
      el.examDialogSlot.textContent = `${schedule.name} / ${weekday} ${period}限`;
      el.dlgExamSubject.value = cur?.subject || "";
      el.dlgExamRoom.value = cur?.room || "";
      el.dlgExamTime.value = cur?.time || "";
      el.dlgExamDelete.style.display = cur ? "inline-block" : "none";
      el.examClassDialog.showModal();
      el.dlgExamSubject.focus();
    }

    function renderExamList() {
      const schedules = examSchedules();
      if (!schedules.length) {
        el.examList.innerHTML = "<div class='text-slate-400'>時間割未登録</div>";
        return;
      }
      el.examList.innerHTML = schedules.map((s, i) => {
        const rows = (s.classes || []).map((c, j) => `${c.weekday} ${c.period}限 ${escapeHtml(c.subject)} (${escapeHtml(c.room)}) ${c.time || ""} <button type='button' class='text-rose-700 underline' data-rm-class='${i}:${j}'>削除</button>`).join("<br>");
        return `<div class='border rounded p-3 mb-2'>
          <div class='font-bold'>${escapeHtml(s.name)} (${s.start}〜${s.end})</div>
          <div class='text-sm mt-2'>${rows || "授業なし"}</div>
        </div>`;
      }).join("");
      el.examList.querySelectorAll("button[data-rm-class]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [si, ci] = btn.dataset.rmClass.split(":").map(Number);
          const schedules = examSchedules();
          schedules[si].classes.splice(ci, 1);
          save();
          renderExamTimetable();
          renderExamList();
        });
      });
    }

    function renderExamOverrides() {
      const keys = Object.keys(draft.exam_period_overrides || {});
      el.examOvList.innerHTML = keys.length
        ? keys.map(k => `${k}限 → ${draft.exam_period_overrides[k]} <button class='text-rose-700 underline' data-rm-ov='${k}'>削除</button>`).join("<br>")
        : "<div class='text-slate-400'>未設定</div>";
      el.examOvList.querySelectorAll("button[data-rm-ov]").forEach(btn => {
        btn.addEventListener("click", () => {
          delete draft.exam_period_overrides[btn.dataset.rmOv];
          save();
          renderExamOverrides();
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    periods.forEach(p => {
      const o2 = document.createElement("option"); o2.value = p; o2.textContent = `${p}限`; el.examOvPeriod.appendChild(o2);
    });

    el.examFirst.value = draft.notify?.exam_first ?? 30;
    el.examSecond.value = draft.notify?.exam_second ?? 25;

    el.examFirst.addEventListener("change", () => { draft.notify.exam_first = Number(el.examFirst.value || 30); save(); });
    el.examSecond.addEventListener("change", () => { draft.notify.exam_second = Number(el.examSecond.value || 25); save(); });

    el.addSchedule.addEventListener("click", () => {
      const name = el.schedName.value.trim();
      const start = el.schedStart.value;
      const end = el.schedEnd.value;
      if (!name || !start || !end) return;
      const schedules = examSchedules();
      schedules.push({ name, start, end, classes: [] });
      save();
      renderScheduleSelect();
      el.targetSchedule.value = String(schedules.length - 1);
      renderExamTimetable();
      renderExamList();
    });

    el.removeSchedule.addEventListener("click", () => {
      const idx = Number(el.targetSchedule.value);
      const schedules = examSchedules();
      if (Number.isNaN(idx) || idx < 0 || !schedules[idx]) return;
      schedules.splice(idx, 1);
      save();
      renderScheduleSelect();
      renderExamTimetable();
      renderExamList();
    });

    el.targetSchedule.addEventListener("change", () => {
      renderExamTimetable();
    });

    el.dlgExamSave.addEventListener("click", () => {
      const schedule = selectedSchedule();
      if (!editing || !schedule) return;
      const subject = el.dlgExamSubject.value.trim();
      const room = el.dlgExamRoom.value.trim();
      setExamClass(schedule, editing.weekday, editing.period, subject, room, el.dlgExamTime.value || null);
      el.examClassDialog.close();
    });

    el.dlgExamDelete.addEventListener("click", () => {
      const schedule = selectedSchedule();
      if (!editing || !schedule) return;
      setExamClass(schedule, editing.weekday, editing.period, "", "", null);
      el.examClassDialog.close();
    });

    el.dlgExamClose.addEventListener("click", () => {
      el.examClassDialog.close();
    });

    el.addExamOv.addEventListener("click", () => {
      if (!el.examOvPeriod.value || !el.examOvTime.value) return;
      draft.exam_period_overrides[el.examOvPeriod.value] = el.examOvTime.value;
      save();
      renderExamOverrides();
    });

    // Enter: 次項目へ。末尾は保存/追加。
    wireEnterFlow([el.examFirst, el.examSecond], () => {
      draft.notify.exam_first = Number(el.examFirst.value || 30);
      draft.notify.exam_second = Number(el.examSecond.value || 25);
      save();
    });
    wireEnterFlow([el.schedName, el.schedStart, el.schedEnd], () => el.addSchedule.click());
    wireEnterFlow([el.examOvPeriod, el.examOvTime], () => el.addExamOv.click());
    wireEnterFlow([el.dlgExamSubject, el.dlgExamRoom, el.dlgExamTime], () => el.dlgExamSave.click());

    // Term toggle handlers
    el.termToggle1st.addEventListener("click", () => {
      currentTerm = "前期";
      localStorage.setItem(TERM_STORAGE_KEY, currentTerm);
      el.termToggle1st.classList.add("bg-emerald-600", "text-white", "hover:bg-emerald-700");
      el.termToggle1st.classList.remove("bg-slate-300", "text-slate-700", "hover:bg-slate-400");
      el.termToggle2nd.classList.remove("bg-emerald-600", "text-white", "hover:bg-emerald-700");
      el.termToggle2nd.classList.add("bg-slate-300", "text-slate-700", "hover:bg-slate-400");
      renderScheduleSelect();
      renderExamTimetable();
      renderExamList();
    });

    el.termToggle2nd.addEventListener("click", () => {
      currentTerm = "後期";
      localStorage.setItem(TERM_STORAGE_KEY, currentTerm);
      el.termToggle2nd.classList.add("bg-emerald-600", "text-white", "hover:bg-emerald-700");
      el.termToggle2nd.classList.remove("bg-slate-300", "text-slate-700", "hover:bg-slate-400");
      el.termToggle1st.classList.remove("bg-emerald-600", "text-white", "hover:bg-emerald-700");
      el.termToggle1st.classList.add("bg-slate-300", "text-slate-700", "hover:bg-slate-400");
      renderScheduleSelect();
      renderExamTimetable();
      renderExamList();
    });

    // Initialize term toggle button appearance
    if (currentTerm === "前期") {
      el.termToggle1st.classList.add("bg-emerald-600", "text-white", "hover:bg-emerald-700");
      el.termToggle1st.classList.remove("bg-slate-300", "text-slate-700", "hover:bg-slate-400");
    } else {
      el.termToggle2nd.classList.add("bg-emerald-600", "text-white", "hover:bg-emerald-700");
      el.termToggle2nd.classList.remove("bg-slate-300", "text-slate-700", "hover:bg-slate-400");
    }

    // Key issuance function
    async function issueLinkKey(feature) {
      const data = {
        ...draft,
        notify: {
          ...draft.notify,
          exam_first: Number(el.examFirst.value || 30),
          exam_second: Number(el.examSecond.value || 25),
        },
        gmail_auth_code: (draft.gmail_auth_code || "").trim(),
      };

      const body = {
        feature: feature || "all",
        data,
        _meta: { term: currentTerm },
      };

      try {
        const res = await fetch(`${BACKEND}/api/public/issue-link-key`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `API error: ${res.status}`);
        }
        const result = await res.json();
        showResult(feature, result);
      } catch (e) {
        showResult(feature, null, String(e));
      }
    }

    function showResult(feature, result, error) {
      const featureNames = { all: "全機能", classes: "時間割", notify: "通知", overrides: "上書き", gmail: "Gmail認証", exam: "試験" };
      const featName = featureNames[feature] || feature;
      if (error) {
        el.result.innerHTML = `<span class="text-rose-700 font-bold">エラー：</span> ${escapeHtml(error)}`;
      } else {
        el.result.innerHTML = `<span class="text-emerald-700 font-bold">${escapeHtml(featName)}キー発行成功！</span><br>キー: <code class="bg-white px-2 py-1 rounded border border-slate-300">${escapeHtml(result.link_key)}</code><br>有効期限: ${new Date(result.expires_at).toLocaleString("ja-JP")}`;
      }
      el.result.classList.remove("hidden");
    }

    el.issueKeyAll.addEventListener("click", async () => issueLinkKey("all"));
    el.issueKeyClasses.addEventListener("click", async () => issueLinkKey("classes"));
    el.issueKeyNotify.addEventListener("click", async () => issueLinkKey("notify"));
    el.issueKeyOverrides.addEventListener("click", async () => issueLinkKey("overrides"));
    el.issueKeyGmail.addEventListener("click", async () => issueLinkKey("gmail"));
    el.issueKeyExam.addEventListener("click", async () => issueLinkKey("exam"));

    // Initialize draft - ensure term-aware structure exists
    draft.classes_by_term = draft.classes_by_term || { "前期": [], "後期": [] };
    draft.exam_schedules_by_term = draft.exam_schedules_by_term || { "前期": [], "後期": [] };

    renderScheduleSelect();
    renderExamTimetable();
    renderExamList();
    renderExamOverrides();
  </script>
</body>
</html>
